[core]
# Path to SQLite database file used by the core service.
database_path = "./data/openoman.db"

[server]
# HTTP control plane bind address and optional bearer token auth.
host = "127.0.0.1"
port = 8080
# auth_token = "replace-me"
# auth_token_env = "OPENOMAN_SERVER_TOKEN"

[git]
# Base directory where trusted clones are stored.
trusted_workspace_dir = "./workspaces/trusted"
# Directory containing optional per-repo env overlays. For repo alias `my_repo`,
# openoman will copy files from `./env_for_repo/my_repo` into the sandbox workspace root.
env_for_repo_dir = "./env_for_repo"

[git.naming]
# Optional trusted host-side LLM naming for branch names and commit messages.
# If api_key/api_key_env is not set, openoman keeps the legacy deterministic naming path:
# branch_name = "<branch_prefix>/<job_id>"
# commit_message = "OpenOMAN job <job_id>"
provider = "openai"
model = "gpt-5-mini"
api_key_env = "OPENOMAN_GIT_NAMING_OPENAI_API_KEY"
api_base_url = "https://api.openai.com/v1"
curl_bin = "curl"
timeout_seconds = 30
prompt_template = '''
Return strict JSON with keys "branch_name" and "commit_message".
Available template variables: {{job_id}}, {{repo_alias}}, {{repo_ref}}, {{revision}}, {{platform}}, {{instruction}}.
Use job_id={{job_id}} repo={{repo_alias}} repo_ref={{repo_ref}} revision={{revision}} platform={{platform}}.
The commit_message must stay single-line.
Instruction: {{instruction}}
'''

[[git.accounts]]
# Reusable git account identity used for trusted publish commits.
alias = "github-personal"
# Reads token from host env at runtime; leave unset to allow run success with publish warning.
token_env = "OPENOMAN_GITHUB_TOKEN"
git_user_name = "OpenOMAN Bot"
git_user_email = "openoman-bot@example.com"

[[git.accounts]]
alias = "gitlab-work"
token_env = "OPENOMAN_GITLAB_TOKEN"
git_user_name = "OpenOMAN Work Bot"
git_user_email = "openoman-work@example.com"

[[git.repos]]
alias = "my_repo"
repo_ref = "https://github.com/username/reponame.git"
platform = "github"
account = "github-personal"
# Optional. Defaults to the repo alias when omitted.
# env_repo_name = "reponame"
# Optional. Runs on the trusted host after clone + checkout and before sandbox copy.
# post_clone_command = "git submodule update --init --recursive"
# Optional when inferable from repo_ref/push_url.
repo_owner = "username"
repo_name = "reponame"
# Optional GitHub publish overrides.
# Also used by the legacy branch naming path when git.naming is disabled.
branch_prefix = "openoman"
api_base_url = "https://api.github.com"

[[git.repos]]
alias = "internal-gitlab"
repo_ref = "https://gitlab.example.com/group/project.git"
platform = "gitlab_self_hosted"
account = "gitlab-work"
# Optional when inferable from repo_ref/push_url. repo_owner may include subgroup path segments.
repo_owner = "group"
repo_name = "project"
# Also used by the legacy branch naming path when git.naming is disabled.
branch_prefix = "openoman"
# Defaults to https://gitlab.example.com/api/v4 when omitted and the host can be inferred.
# api_base_url = "https://gitlab.example.com/api/v4"
# Defaults to https://gitlab.example.com/group/project.git when omitted.
# push_url = "https://gitlab.example.com/group/project.git"
# Optional per-repo curl override for trusted publish API calls.
# curl_bin = "curl"

[sandbox]
# Virtualization backend used for sandbox attempts.
backend = "firecracker"
# Base directory where sandbox runs are materialized.
runtime_dir = "./workspaces/sandboxes"
# Firecracker resource controls for the direct backend.
timeout_seconds = 1800
memory_mb = 2048
cpu_cores = 2

[sandbox.firecracker]
# direct works in this release; jailer is reserved for a future hardened mode.
mode = "direct"
firecracker_bin = "firecracker"
jailer_bin = "jailer"
# Provide host paths to the guest kernel and rootfs assets.
kernel_image_path = "/opt/openoman/guest/vmlinux"
rootfs_image_path = "/opt/openoman/guest/rootfs.ext4"
# Optional explicit size for the per-attempt runtime disk (/dev/vdb), in MiB.
# This is where workspace data, staged config, and guest Docker data live.
# Omit to keep the current dynamic sizing behavior.
# runtime_disk_mb = 4096
guest_cid_base = 10000
# Optional: start dockerd inside the guest so docker-compose workflows can talk to
# /var/run/docker.sock from inside the microVM. Disabled by default to avoid extra
# startup cost for runs that do not need Docker-in-Docker.
# docker_daemon = true
# Optional explicit Docker registry auth staged into the guest as /root/.docker/config.json.
# Disabled by default so registry secrets do not enter the sandbox unless you opt in.
# docker_auth_config = "~/.docker/config.json"
# Or read the JSON contents from a host environment variable at run time:
# docker_auth_config_env = "OPENOMAN_DOCKER_CONFIG_JSON"

[sandbox.firecracker.network]
# disabled: no guest NIC.
# host-proxy: attach a tap-backed NIC and route guest HTTPS through a host-local allowlisting proxy.
mode = "host-proxy"
# sudo: use the hidden openoman helper through sudo for tap lifecycle management.
# direct: manage tap lifecycle directly when the whole process already has CAP_NET_ADMIN/root.
privilege_mode = "sudo"
tap_name_prefix = "oomtap"
proxy_port = 3128
# Optional CONNECT destination ports allowed by the host proxy. Defaults to [443].
# Add registry ports such as 5050 here when Docker needs to pull from a private registry
# that does not listen on 443.
# allowed_connect_ports = [443, 5050]
subnet_cidr = "172.22.0.0/16"

[[sandbox.firecracker.user_package_dirs]]
# Optional allowlisted host-user package directory copied into each run.
host_path = "~/.local/bin"
guest_path = "/opt/openoman/user-bin"
add_to_path = true

[agent]
# Agent provider executed inside the sandbox. Supported providers: "codex", "cursor", "claude".
provider = "codex"
# Preferred provider-neutral command path.
bin = "/usr/local/bin/codex"
# Codex-only optional host auth file copied into the guest as /root/.codex/auth.json.
# auth_file = "~/.codex/auth.json"
# Cursor-only inline API key copied into the guest as CURSOR_API_KEY.
# api_key = "crsr_..."
# Optional alternative: host environment variable name whose value will be injected into the guest
# as CURSOR_API_KEY at `openoman run` time.
# api_key_env = "OPENOMAN_CURSOR_API_KEY"
# Legacy Codex-only aliases still accepted for backward compatibility:
# codex_bin = "/usr/local/bin/codex"
# codex_auth_file = "~/.codex/auth.json"
# Domain allowlist enforced by the host CONNECT proxy in host-proxy networking mode.
egress_allowed_domains = ["api.openai.com"]
# For Claude Code, switch the provider and pass a subscription OAuth token
# (created with `claude setup-token`) or an Anthropic API key:
# provider = "claude"
# bin = "claude"
# model = "claude-opus-4-6"
# api_key = "sk-ant-oat01-..."
# Or: api_key_env = "OPENOMAN_CLAUDE_OAUTH_TOKEN"
# egress_allowed_domains = ["api.anthropic.com"]
#
# For Cursor, switch the provider/bin and use Cursor's API domain instead:
# provider = "cursor"
# bin = "cursor-agent"
# model = "gpt-5"
# api_key = "crsr_..."
# Or: api_key_env = "OPENOMAN_CURSOR_API_KEY"
# egress_allowed_domains = ["api2.cursor.sh"]
# For debugging only, disable hostname filtering and enable broader guest egress via the host:
# egress_allowed_domains = ["*"]

[publishing]
# Legacy fallback publishing settings used when submitting raw repo refs (non-alias `--repo`).
# Alias-based repositories should prefer [[git.repos]] + [[git.accounts]] above.
# Trusted raw-ref publishing remains GitHub-only and runs only after validation succeeds.
provider = "github"
repo_owner = "example"
repo_name = "example-repo"
# Defaults to the submitted revision when omitted.
# base_branch = "main"
# Prefix used for the pushed branch name in the legacy deterministic naming path,
# which becomes "<branch_prefix>/<job_id>" when git.naming is disabled.
branch_prefix = "openoman"
api_base_url = "https://api.github.com"
# Defaults to https://github.com/<repo_owner>/<repo_name>.git when omitted.
# push_url = "https://github.com/example/example-repo.git"
# Prefer an environment variable so the token does not live in this file.
# `github_token_env` is the local environment variable name that openoman reads.
# Example: `github_token_env = "OPENOMAN_GITHUB_TOKEN"` means you should export
# `OPENOMAN_GITHUB_TOKEN=<your token>` before running `openoman`.
# Create the GitHub personal access token in GitHub Settings -> Developer settings ->
# Personal access tokens, or see the official docs:
# https://docs.github.com/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
github_token_env = "OPENOMAN_GITHUB_TOKEN"
curl_bin = "curl"
