title = "OpenOMAN local secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Generated guest rootfs artifacts"
paths = [
  '''^guest/out/''',
]

[[allowlists]]
description = "Documentation bearer token example"
condition = "AND"
regexTarget = "match"
paths = [
  '''^docs/api/control-plane\.md$''',
]
regexes = [
  '''Authorization:\s+Bearer\s+secret-token''',
]

[[allowlists]]
description = "Test docker auth fixture in config tests"
condition = "AND"
regexTarget = "match"
paths = [
  '''^crates/cli/src/config\.rs$''',
]
regexes = [
  '''auth":"ZW52LXRlc3Q="''',
]
