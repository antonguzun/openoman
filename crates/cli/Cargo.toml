[package]
name = "openoman-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "openoman"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
openoman-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
