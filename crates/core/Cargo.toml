[package]
name = "openoman-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "openoman_core"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "=3.12.0"
